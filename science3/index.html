<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中3理科ゲーム</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <h2>🟣 中3理科 一問一答</h2>
        
        <div id="game-view">
            <p>この説明に合う用語を入力してね（漢字・ひらがな）：</p>
            <div id="progress" style="font-weight: bold; color: #555;"></div>
            <div id="question" class="word-box" style="font-size: 1.3em;">読み込み中...</div>
            <input type="text" id="answer-input" class="input-area" placeholder="答えを入力" autofocus autocomplete="off">
            <div id="result" class="result"></div>
        </div>
        
        <a href="../science.html" class="btn back-btn">戻る</a>
    </div>

    <script>
        // 💡 中3理科の重要問題データ（全40問からランダムで10問出題）
        const quizList = [
            // --- 化学分野 ---
            { question: "水に溶けたときに電離して、電流を流す物質を何というか？", answer: "電解質" },
            { question: "水に溶けても電離せず、電流を流さない物質を何というか？", answer: "非電解質" },
            { question: "原子が電気を帯びたものを何というか？", answer: "イオン" },
            { question: "原子が電子を失って、プラスの電気を帯びたものを何というか？", answer: "陽イオン" },
            { question: "原子が電子を受け取って、マイナスの電気を帯びたものを何というか？", answer: "陰イオン" },
            { question: "酸性の水溶液に共通して含まれるイオンの名称は？", answer: "水素イオン" },
            { question: "アルカリ性の水溶液に共通して含まれるイオンの名称は？", answer: "水酸化物イオン" },
            { question: "酸とアルカリが反応して、互いの性質を打ち消し合う反応を何というか？", answer: "中和" },
            { question: "中和反応のときに、酸の陰イオンとアルカリの陽イオンが結びついてできる物質は？", answer: "塩" },
            { question: "物質が持つ化学エネルギーを電気エネルギーに変換する装置を何というか？", answer: "電池" },

            // --- 生物分野 ---
            { question: "生物の細胞が分裂して2つに分かれることを何というか？", answer: "細胞分裂" },
            { question: "体細胞を作るときに行われる、元の細胞と同じ染色体数の細胞分裂は？", answer: "体細胞分裂" },
            { question: "生殖細胞が作られるときに行われる、染色体の数が半分になる特別な分裂は？", answer: "減数分裂" },
            { question: "雌雄の親に関係なく、自分が単独で新しい個体を作る生殖を何というか？", answer: "無性生殖" },
            { question: "オスの生殖細胞（精子）とメスの生殖細胞（卵）が受精することによって行う生殖は？", answer: "有性生殖" },
            { question: "精子の核と卵の核が合体することを何というか？", answer: "受精" },
            { question: "受精卵が細胞分裂を始めてから、自分で食物をとり始める前までの状態を何というか？", answer: "胚" },
            { question: "親の形質が子や孫に伝わる現象を何というか？", answer: "遺伝" },
            { question: "細胞の核の中にあり、遺伝子が含まれているひも状の物質は？", answer: "染色体" },
            { question: "染色体に含まれる、遺伝子の本体である化学物質の略称は？", answer: "DNA" },

            // --- 物理分野 ---
            { question: "物体が一定の時間内に移動した距離を、かかった時間で割ったものを何というか？", answer: "速さ" },
            { question: "ごく短い時間に移動した距離をもとに求めた、刻々と変化する速さを何というか？", answer: "瞬間の速さ" },
            { question: "一方向へ一定の速さで進む、力が働いていないときの運動を何というか？", answer: "等速直線運動" },
            { question: "物体に力が働かないとき、静止している物体は静止し続け、動いている物体は等速直線運動を続ける性質は？", answer: "慣性" },
            { question: "物体に力を加えたとき、それと同時に受ける反対向きで同じ大きさの力を何の力というか？", answer: "反作用" },
            { question: "動いている物体が持っているエネルギーを何というか？", answer: "運動エネルギー" },
            { question: "高いところにある物体が持っているエネルギーを何というか？", answer: "位置エネルギー" },
            { question: "位置エネルギーと運動エネルギーの総和を何というか？", answer: "力学的エネルギー" },
            { question: "物体に力を加えて、その力の向きに物体を移動させることを何というか？", answer: "仕事" },
            { question: "1秒あたりに行う仕事の量を何というか？", answer: "仕事率" },

            // --- 地学分野 ---
            { question: "太陽のように、自ら光を放つ天体を何というか？", answer: "恒星" },
            { question: "地球が太陽のまわりを1年かけて1周する運動を何というか？", answer: "公転" },
            { question: "地球が自分の地軸を中心に、1日に1周する運動を何というか？", answer: "自転" },
            { question: "地球の自転によって、太陽や星が1日に1周するように見える運動を何というか？", answer: "日周運動" },
            { question: "地球の公転によって、太陽が星座の間を1年かけて1周するように見える運動を何というか？", answer: "年周運動" },
            { question: "太陽のまわりを公転している、地球などの大きな天体を何というか？", answer: "惑星" },
            { question: "惑星のまわりを公転している、月などの天体を何というか？", answer: "衛星" },
            { question: "火星と木星の間などに無数にある、岩石でできた小さな天体を何というか？", answer: "小惑星" },
            { question: "太陽系が含まれる、数千億個の恒星が集まった大きな集団を何というか？", answer: "銀河系" },
            { question: "太陽の表面に見られる、周囲より温度が低いために黒く見える部分を何というか？", answer: "黒点" }
        ];

        let currentQuiz = {}; let questionCount = 0; let correctCount = 0; const MAX_QUESTIONS = 10;

        function nextQuestion() {
            if (questionCount >= MAX_QUESTIONS) { showResultScreen(); return; }
            questionCount++;
            const randomIndex = Math.floor(Math.random() * quizList.length);
            currentQuiz = quizList[randomIndex];
            
            document.getElementById('progress').innerText = `${questionCount} / ${MAX_QUESTIONS} 問目`;
            document.getElementById('question').innerText = currentQuiz.question;
            document.getElementById('answer-input').value = "";
            document.getElementById('answer-input').disabled = false;
            document.getElementById('result').innerText = "";
            document.getElementById('answer-input').focus();
        }

        function showResultScreen() {
            document.getElementById('game-view').innerHTML = `
                <h3 style="font-size: 1.5em; color: #ff9800;">🎉 テスト終了！</h3>
                <div class="word-box" style="font-size: 1.8em;">結果：${correctCount} / ${MAX_QUESTIONS} 問正解！</div>
                <button onclick="location.reload()" class="btn" style="background-color: #ff5722; border: none; width: 100%; cursor: pointer;">もう一度挑戦する</button>
            `;
        }

        document.getElementById('answer-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const userAnswer = this.value.trim();
                const resultDiv = document.getElementById('result');
                this.disabled = true;
                
                if (userAnswer === currentQuiz.answer) {
                    resultDiv.style.color = "green"; resultDiv.innerText = "⭕ 正解！"; correctCount++;
                } else {
                    resultDiv.style.color = "red"; resultDiv.innerText = `❌ 不正解！正解は [ ${currentQuiz.answer} ]`;
                }
                setTimeout(nextQuestion, 1500);
            }
        });
        nextQuestion();
    </script>
</body>
</html>
